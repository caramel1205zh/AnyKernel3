name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "This is the ReSukiSU variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "ReSukiSU..."
            REPO="ReSukiSU/ReSukiSU"
            KSUM="manager"
          fi

          FILENAME="build-manager.yml"


          # 按内核 KSU 版本选择 Manager，避免 APK 版本领先于内核版本
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "无效的目标 KSU 版本: $TARGET_KSU_VERSION"
            exit 1
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
            fi
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              return 1
            fi

            local git_version
            git_version=$(git -C KernelSU rev-list --count "$head_sha")
            case "${{ inputs.kernelsu_variant }}" in
              "SukiSU") echo $((40000 + git_version - 2815)) ;;
              "ReSukiSU") echo $((30700 + git_version)) ;;
              *) return 1 ;;
            esac
          }

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          # 仿 ReSukiSU_CI 拉取方式：只检索官方 main 分支上传的构建，
          # 并以下载到的 APK 文件名实测 versionCode 为准（head_sha 推算可能不准），
          # 确保 artifact 包名与包内 APK 版本严格一致
          MANAGER_VERSION=""
          MANAGER_BUILD_ID=""
          MANAGER_BRANCH=""
          FETCHED=0
          MAX_FETCH=5
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&branch=main&per_page=30"

          echo "开始检索官方 main 分支不高于内核 KSU $TARGET_KSU_VERSION 的 Manager 构建..."
          for PAGE in $(seq 1 10); do
            echo "--------------------------------------------------"
            echo "正在检查第 ${PAGE} 页历史构建..."
            RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RUNS_URL&page=$PAGE")
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "跳过构建 $BUILD_ID: 无法根据提交 $HEAD_SHA 计算 KSU 版本"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION 高于内核 KSU $TARGET_KSU_VERSION"
                continue
              fi

              # 限制下载校验次数，避免异常情况下流量爆炸
              if [ "$FETCHED" -ge "$MAX_FETCH" ]; then
                echo "已下载校验 $FETCHED 个构建，达到上限 $MAX_FETCH，停止检索"
                break 2
              fi

              ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): 未找到包含 '$KSUM' 的产物"
                continue
              fi

              # 下载并解压该构建实际上传的 Manager 产物
              FETCHED=$((FETCHED + 1))
              echo "下载构建 $BUILD_ID ($HEAD_BRANCH, 推算 KSU $RUN_KSU_VERSION) 的产物..."
              rm -rf manager-artifacts
              mkdir -p manager-artifacts
              while IFS=$'\t' read -r NAME URL; do
                SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
                if ! curl -sL --fail -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -o "manager-artifacts/$SAFE_NAME.zip" "$URL"; then
                  echo "下载 $NAME 失败"
                  continue
                fi
                mkdir -p "manager-artifacts/$SAFE_NAME"
                unzip -oq "manager-artifacts/$SAFE_NAME.zip" -d "manager-artifacts/$SAFE_NAME" || echo "解压 $NAME 失败"
                rm -f "manager-artifacts/$SAFE_NAME.zip"
              done <<< "$CANDIDATE_LIST"

              # 从 APK 文件名提取实测 versionCode
              APK_FILE=$(find manager-artifacts -type f -name "*.apk" ! -name "*debug*" | head -n 1)
              if [ -z "$APK_FILE" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): artifact 中无 release APK"
                continue
              fi
              ACTUAL_VERSION=$(basename "$APK_FILE" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
              if ! [[ "$ACTUAL_VERSION" =~ ^[0-9]+$ ]]; then
                echo "警告: 无法从 APK 文件名解析版本 ($(basename "$APK_FILE"))，回退使用推算值 $RUN_KSU_VERSION"
                ACTUAL_VERSION="$RUN_KSU_VERSION"
              fi
              if [ "$ACTUAL_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): APK 实测版本 $ACTUAL_VERSION 高于内核 KSU $TARGET_KSU_VERSION（推算值不可信）"
                continue
              fi

              MANAGER_VERSION="$ACTUAL_VERSION"
              MANAGER_BUILD_ID="$BUILD_ID"
              MANAGER_BRANCH="$HEAD_BRANCH"
              if [ "$ACTUAL_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                echo "精确匹配: 构建 $BUILD_ID ($HEAD_BRANCH), APK 实测版本 $ACTUAL_VERSION = 内核 KSU $TARGET_KSU_VERSION"
              else
                echo "::warning::官方 main 分支暂无等于内核 KSU $TARGET_KSU_VERSION 的 Manager 构建，使用最新可用版本 $ACTUAL_VERSION（构建 $BUILD_ID, $HEAD_BRANCH）"
              fi
              break 2
            done
          done

          if [ -z "$MANAGER_VERSION" ]; then
            echo "未获取到 KSU 版本小于等于 $TARGET_KSU_VERSION 的 Manager artifact。"
            exit 1
          fi
          echo "选择 Manager 构建 $MANAGER_BUILD_ID ($MANAGER_BRANCH), APK 实测版本 $MANAGER_VERSION"
          echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV

          if [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "仅保留 ReSukiSU arm64-v8a release 管理器..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "未找到 ReSukiSU arm64-v8a release 管理器。"
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          # 上游 susfs4ksu-module 的 Actions artifacts 已全部过期，
          # 模块现通过 GitHub Releases 发布，改为拉取最新 Release 资产
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "获取 Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "无法获取 susfs4ksu-module 最新 Release 信息"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Release $TAG_NAME 中未找到 ksu_module_susfs 模块 zip"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "下载 SUSFS 模块: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "下载 SUSFS 模块失败: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Release 资产本身即完整模块 zip，校验完整性后直接放入模块目录
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "下载的 SUSFS 模块 zip 损坏"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
