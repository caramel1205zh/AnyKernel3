name: 内核构建 - Android 14 (6.1.138)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
        default: SukiSU
      version:
        description: "自定义版本名"
        required: false
        type: string
        default: "-android14-11-g0c3d559bcd85-ab14529422"
      build_time:
        description: "自定义构建时间"
        required: false
        type: string
        default: "Wed Dec  3 02:05:30 UTC 2025"
      use_kpm:
        description: "KPM 功能"
        required: true
        type: choice
        default: "enabled (开启)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "678"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 压缩算法"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 基带保护"
        required: true
        type: boolean
        default: true
      use_net_enhance:
        description: "启用 网络增强 (IPSet + BBR)"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: true
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      skip_incompatible:
        description: "功能不兼容或无法使用时自动跳过该功能（不中断构建）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
        default: "-android14-11-g0c3d559bcd85-ab14529422"
      build_time:
        required: false
        type: string
        default: "Wed Dec  3 02:05:30 UTC 2025"
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_net_enhance:
        required: true
        type: boolean
        default: true
      use_kpm:
        required: true
        type: string
        default: "enabled (开启)"
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: true
      cancel_susfs:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "678"
      artifact_upload_mode:
        required: false
        type: string
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: true
      skip_incompatible:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a14-6-1:
    name: "6.1.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "138"
            os_patch_level: "2025-06"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '-android14-11-g0c3d559bcd85-ab14529422' }}
      build_time: ${{ inputs.build_time || 'Wed Dec  3 02:05:30 UTC 2025' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || '678' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || true }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
